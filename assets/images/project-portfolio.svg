<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020804"/>
      <stop offset="50%" stop-color="#07170E"/>
      <stop offset="100%" stop-color="#0E2D1B"/>
    </linearGradient>
    <linearGradient id="emeraldGradPf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20B45A"/>
      <stop offset="100%" stop-color="#32D875"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#portBg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#20B45A" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="52" x2="900" y2="52"/><line x1="0" y1="104" x2="900" y2="104"/><line x1="0" y1="156" x2="900" y2="156"/>
    <line x1="0" y1="208" x2="900" y2="208"/><line x1="0" y1="260" x2="900" y2="260"/><line x1="0" y1="312" x2="900" y2="312"/>
    <line x1="0" y1="364" x2="900" y2="364"/><line x1="0" y1="416" x2="900" y2="416"/><line x1="0" y1="468" x2="900" y2="468"/>
    <line x1="100" y1="0" x2="100" y2="520"/><line x1="200" y1="0" x2="200" y2="520"/><line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/><line x1="500" y1="0" x2="500" y2="520"/><line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="700" y1="0" x2="700" y2="520"/><line x1="800" y1="0" x2="800" y2="520"/>
  </g>

  <circle cx="350" cy="240" r="250" fill="#20B45A" opacity="0.13" filter="blur(70px)"/>

  <!-- Browser Frame -->
  <g transform="translate(45, 30)" filter="url(#cardShadow)">
    <rect width="810" height="460" rx="14" fill="#040C07" stroke="#20B45A" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Titlebar -->
    <rect width="810" height="50" rx="14" fill="#07170E"/>
    <line x1="0" y1="50" x2="810" y2="50" stroke="#20B45A" stroke-opacity="0.25"/>

    <circle cx="25" cy="25" r="6" fill="#FF5F56"/>
    <circle cx="43" cy="25" r="6" fill="#FFBD2E"/>
    <circle cx="61" cy="25" r="6" fill="#27C93F"/>

    <!-- URL bar -->
    <rect x="180" y="11" width="380" height="28" rx="7" fill="#030805" stroke="#1D4A2F"/>
    <circle cx="200" cy="25" r="4" fill="#20B45A"/>
    <text x="215" y="29" fill="#A6ADA8" font-family="'JetBrains Mono', monospace" font-size="11">https://venkatasai.dev</text>

    <!-- Theme Switch Pill Preview -->
    <g transform="translate(680, 12)">
      <rect width="95" height="26" rx="13" fill="#0A2214" stroke="#20B45A" stroke-width="1"/>
      <circle cx="16" cy="13" r="7" fill="#32D875"/>
      <text x="32" y="17" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">DARK/LIGHT</text>
    </g>

    <!-- Inside Web Content -->
    <g transform="translate(30, 75)">
      <!-- Navbar inside preview -->
      <g>
        <!-- VS Logo Badge -->
        <rect x="0" y="0" width="34" height="28" rx="6" fill="#092414" stroke="#20B45A" stroke-width="1.2"/>
        <text x="8" y="19" fill="#32D875" font-family="'Outfit', sans-serif" font-size="13" font-weight="900">VS</text>
        <text x="44" y="19" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" letter-spacing="1">VENKATA SAI</text>

        <!-- Nav items -->
        <text x="480" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Home</text>
        <text x="535" y="18" fill="#A6ADA8" font-family="system-ui, sans-serif" font-size="11">About</text>
        <text x="590" y="18" fill="#A6ADA8" font-family="system-ui, sans-serif" font-size="11">Achievements</text>
        <text x="690" y="18" fill="#A6ADA8" font-family="system-ui, sans-serif" font-size="11">Skills</text>
      </g>

      <line x1="0" y1="42" x2="750" y2="42" stroke="#183D27" stroke-opacity="0.5"/>

      <!-- Hero preview section -->
      <g transform="translate(0, 65)">
        <!-- Left Side -->
        <g>
          <rect x="0" y="0" width="180" height="24" rx="12" fill="#0A2416" stroke="#20B45A" stroke-opacity="0.6"/>
          <circle cx="14" cy="12" r="4" fill="#32D875"/>
          <text x="26" y="16" fill="#32D875" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">AVAILABLE FOR OPPORTUNITIES</text>

          <text x="0" y="62" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">VENKATA SAI MUDDE</text>
          <text x="0" y="90" fill="#32D875" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Computer Science &amp; Engineering • Full-Stack</text>

          <!-- Text lines -->
          <rect x="0" y="112" width="370" height="8" rx="4" fill="#A6ADA8" fill-opacity="0.3"/>
          <rect x="0" y="128" width="340" height="8" rx="4" fill="#A6ADA8" fill-opacity="0.25"/>
          <rect x="0" y="144" width="280" height="8" rx="4" fill="#A6ADA8" fill-opacity="0.2"/>

          <!-- Social Buttons & CTAs -->
          <g transform="translate(0, 175)">
            <rect width="140" height="38" rx="6" fill="url(#emeraldGradPf)"/>
            <text x="24" y="24" fill="#030504" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Explore Projects ➔</text>

            <rect x="155" y="0" width="130" height="38" rx="6" fill="#07190F" stroke="#20B45A" stroke-width="1.2"/>
            <text x="175" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">View Resume</text>
          </g>
        </g>

        <!-- Right Side: Profile Mockup -->
        <g transform="translate(480, -10)">
          <rect width="250" height="260" rx="14" fill="#030905" stroke="#20B45A" stroke-width="1.5"/>
          <circle cx="125" cy="100" r="55" fill="#0A2215" stroke="#32D875" stroke-width="1.5"/>
          <circle cx="125" cy="85" r="28" fill="#20B45A" fill-opacity="0.5"/>
          <path d="M 90 145 C 90 115, 160 115, 160 145" fill="#20B45A" fill-opacity="0.7"/>

          <!-- Floating Badges -->
          <g transform="translate(-30, 180)">
            <rect width="165" height="42" rx="8" fill="#081E12" stroke="#20B45A" stroke-width="1"/>
            <text x="12" y="20" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">B.Tech CSE Autonomous</text>
            <text x="12" y="34" fill="#32D875" font-family="'JetBrains Mono', monospace" font-size="9">Ramachandra College</text>
          </g>

          <g transform="translate(130, 20)">
            <rect width="135" height="38" rx="8" fill="#081E12" stroke="#32D875" stroke-width="1"/>
            <text x="12" y="18" fill="#32D875" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">🏆 4+ Honors</text>
            <text x="12" y="30" fill="#A6ADA8" font-family="system-ui, sans-serif" font-size="8.5">Hackathons &amp; Symposia</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
